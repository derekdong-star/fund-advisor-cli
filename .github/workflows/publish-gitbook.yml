name: publish-gitbook

on:
  workflow_dispatch:
  schedule:
    # 13:30 UTC = 21:30 Asia/Shanghai, after public fund NAV updates.
    - cron: '30 13 * * 1-5'

permissions:
  contents: write

concurrency:
  group: publish-gitbook
  cancel-in-progress: false

env:
  PUBLISH_BRANCH: gitbook-publish
  PUBLISH_WORKTREE: /tmp/fundcli-gitbook-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUND_ADVISOR_LLM_API_KEY: ${{ secrets.FUND_ADVISOR_LLM_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show trigger time in Asia/Shanghai
        run: TZ=Asia/Shanghai date '+triggered at %Y-%m-%d %H:%M:%S %Z'

      - name: Restore advisor state
        uses: actions/cache/restore@v4
        with:
          path: data/fundcli.db
          key: fundcli-state-${{ github.run_id }}-${{ github.run_attempt }}-final
          restore-keys: |
            fundcli-state-

      - name: Restore momentum history fallback
        run: |
          git fetch origin "${PUBLISH_BRANCH}" || true
          if git show "origin/${PUBLISH_BRANCH}:docs/gitbook/.momentum-state.json" > /tmp/momentum-state.json 2>/dev/null; then
            go run ./cmd/fundcli momentum-state import --config ./configs/portfolio.yaml --input /tmp/momentum-state.json
          fi

      - name: Capture daily momentum validation
        run: go run ./cmd/fundcli momentum-pool --config ./configs/portfolio.yaml --days 300 --format json --output /tmp/momentum-pool.json >/dev/null

      - name: Save daily momentum state
        uses: actions/cache/save@v4
        with:
          path: data/fundcli.db
          key: fundcli-state-${{ github.run_id }}-${{ github.run_attempt }}-momentum

      - name: Refresh portfolio NAV data
        run: go run ./cmd/fundcli fetch --config ./configs/portfolio.yaml --days 300

      - name: Publish GitBook docs
        run: go run ./cmd/fundcli docs publish --config ./configs/portfolio.yaml --refresh --skip-fetch --days 300

      - name: Save final advisor state
        uses: actions/cache/save@v4
        with:
          path: data/fundcli.db
          key: fundcli-state-${{ github.run_id }}-${{ github.run_attempt }}-final

      - name: Export momentum history fallback
        run: go run ./cmd/fundcli momentum-state export --config ./configs/portfolio.yaml --output docs/gitbook/.momentum-state.json

      - name: Show generated docs status
        run: git status --short docs/gitbook

      - name: Prepare publish worktree
        run: |
          git fetch origin "${PUBLISH_BRANCH}" || true
          rm -rf "${PUBLISH_WORKTREE}"
          if git show-ref --verify --quiet "refs/remotes/origin/${PUBLISH_BRANCH}"; then
            git worktree add -B "${PUBLISH_BRANCH}" "${PUBLISH_WORKTREE}" "origin/${PUBLISH_BRANCH}"
          else
            git worktree add --detach "${PUBLISH_WORKTREE}"
            cd "${PUBLISH_WORKTREE}"
            git switch --orphan "${PUBLISH_BRANCH}"
            git rm -rf --cached . || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: Sync docs to publish branch
        run: |
          mkdir -p "${PUBLISH_WORKTREE}/docs"
          rsync -a --delete docs/gitbook/ "${PUBLISH_WORKTREE}/docs/gitbook/"
          cd "${PUBLISH_WORKTREE}"
          git add -A docs/gitbook
          if git diff --cached --quiet; then
            echo "No docs changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitBook docs and market pool snapshot"
          git push origin HEAD:"${PUBLISH_BRANCH}"

      - name: Clean up worktree
        if: always()
        run: |
          git worktree remove "${PUBLISH_WORKTREE}" --force || true
